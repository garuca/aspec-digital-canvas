<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="softGlow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#08080F"/>
  
  <!-- Subtle gradient -->
  <circle cx="600" cy="400" r="350" fill="#7C3AED" opacity="0.02"/>
  
  <!-- Speed lines -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.08">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>
  
  <!-- Radial connection lines -->
  <g stroke="#8B5CF6" stroke-width="1.5" fill="none" opacity="0.5">
    <!-- Top -->
    <path d="M600 300 Q580 200 460 150"/>
    <path d="M600 300 L600 130"/>
    <path d="M600 300 Q620 200 740 150"/>
    
    <!-- Left -->
    <path d="M490 400 Q360 380 260 320"/>
    <path d="M490 400 Q320 400 200 400"/>
    <path d="M490 400 Q360 420 260 480"/>
    <path d="M490 400 Q340 440 220 530"/>
    
    <!-- Right -->
    <path d="M710 400 Q840 380 940 320"/>
    <path d="M710 400 Q880 400 1000 400"/>
    <path d="M710 400 Q840 420 940 480"/>
    <path d="M710 400 Q860 440 980 530"/>
    
    <!-- Bottom -->
    <path d="M600 500 Q560 600 500 660"/>
    <path d="M600 500 L600 700"/>
    <path d="M600 500 Q640 600 700 660"/>
  </g>
  
  <!-- Small connector dots -->
  <g fill="#F59E0B" opacity="0.5">
    <circle cx="530" cy="230" r="2"/>
    <circle cx="670" cy="230" r="2"/>
    <circle cx="375" cy="360" r="2"/>
    <circle cx="825" cy="360" r="2"/>
    <circle cx="550" cy="580" r="2"/>
    <circle cx="650" cy="580" r="2"/>
  </g>
  
  <!-- Central Hub -->
  <g filter="url(#softGlow3)">
    <circle cx="600" cy="400" r="75" fill="url(#orangeGrad)"/>
    <circle cx="600" cy="400" r="68" fill="#08080F" stroke="#FBBF24" stroke-width="2"/>
    
    <!-- Lightning bolt -->
    <g transform="translate(575, 365)">
      <polygon points="35,0 15,35 28,35 10,70 55,25 38,25 55,0" fill="#FBBF24"/>
    </g>
  </g>
  
  <!-- Top Left: MVP -->
  <g transform="translate(460, 150)">
    <rect x="-45" y="-20" width="90" height="40" rx="20" fill="#F59E0B" fill-opacity="0.12" 
      stroke="#F59E0B" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#FCD34D" font-size="14" font-weight="600" 
      font-family="system-ui, sans-serif">MVP</text>
  </g>
  
  <!-- Top Center: Feedback -->
  <g transform="translate(600, 130)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#8B5CF6" fill-opacity="0.12" 
      stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Feedback</text>
  </g>
  
  <!-- Top Right: Deploy -->
  <g transform="translate(740, 150)">
    <rect x="-45" y="-20" width="90" height="40" rx="20" fill="#A855F7" fill-opacity="0.12" 
      stroke="#A855F7" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#D8B4FE" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Deploy</text>
  </g>
  
  <!-- Left 1: Ideia Rápida -->
  <g transform="translate(260, 320)">
    <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Ideia Rápida</text>
  </g>
  
  <!-- Left 2: Prototipar -->
  <g transform="translate(200, 400)">
    <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Prototipar</text>
  </g>
  
  <!-- Left 3: Testar -->
  <g transform="translate(260, 480)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#C084FC" fill-opacity="0.08" 
      stroke="#C084FC" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#D8B4FE" font-size="11" 
      font-family="system-ui, sans-serif">Testar</text>
  </g>
  
  <!-- Left 4: Aprender -->
  <g transform="translate(220, 530)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Aprender</text>
  </g>
  
  <!-- Right 1: Dados Reais -->
  <g transform="translate(940, 320)">
    <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Dados Reais</text>
  </g>
  
  <!-- Right 2: Iterar -->
  <g transform="translate(1000, 400)">
    <rect x="-40" y="-16" width="80" height="32" rx="16" fill="#F59E0B" fill-opacity="0.08" 
      stroke="#F59E0B" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#FCD34D" font-size="11" 
      font-family="system-ui, sans-serif">Iterar</text>
  </g>
  
  <!-- Right 3: Melhorar -->
  <g transform="translate(940, 480)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Melhorar</text>
  </g>
  
  <!-- Right 4: Escalar -->
  <g transform="translate(980, 530)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Escalar</text>
  </g>
  
  <!-- Bottom Left: Release -->
  <g transform="translate(500, 660)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Release</text>
  </g>
  
  <!-- Bottom Center: Métricas -->
  <g transform="translate(600, 700)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#FBBF24" fill-opacity="0.12" 
      stroke="#FBBF24" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#FDE68A" font-size="11" font-weight="500" 
      font-family="system-ui, sans-serif">Métricas</text>
  </g>
  
  <!-- Bottom Right: Evolução -->
  <g transform="translate(700, 660)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Evolução</text>
  </g>
  
  <!-- Loop arrows -->
  <g stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M150 580 Q120 650 200 680"/>
    <polygon points="200,680 190,672 198,668" fill="#F59E0B"/>
    <path d="M1050 580 Q1080 650 1000 680"/>
    <polygon points="1000,680 1010,672 1002,668" fill="#F59E0B"/>
  </g>
  
  <!-- Decorative particles -->
  <g fill="#F59E0B" opacity="0.2">
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="1100" cy="200" r="1"/>
    <circle cx="100" cy="600" r="1.5"/>
    <circle cx="1100" cy="600" r="1"/>
    <circle cx="400" cy="100" r="1"/>
    <circle cx="800" cy="100" r="1"/>
  </g>
</svg>