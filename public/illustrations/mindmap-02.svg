<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#D946EF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="softGlow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#08080F"/>
  
  <!-- Subtle gradient -->
  <circle cx="600" cy="300" r="350" fill="#7C3AED" opacity="0.02"/>
  
  <!-- Main Journey Path -->
  <g>
    <!-- Path background -->
    <path d="M80 400 Q250 400 350 320 Q450 240 600 240 Q750 240 850 320 Q950 400 1120 400" 
      stroke="url(#roadGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Path dots -->
    <g fill="none" stroke="url(#roadGrad)" stroke-width="1" opacity="0.4">
      <circle cx="150" cy="400" r="3"/>
      <circle cx="250" cy="380" r="2"/>
      <circle cx="350" cy="340" r="3"/>
      <circle cx="450" cy="280" r="2"/>
      <circle cx="550" cy="240" r="3"/>
      <circle cx="650" cy="240" r="2"/>
      <circle cx="750" cy="280" r="3"/>
      <circle cx="850" cy="340" r="2"/>
      <circle cx="950" cy="380" r="3"/>
      <circle cx="1050" cy="400" r="2"/>
    </g>
  </g>
  
  <!-- Branch connections -->
  <g stroke="#8B5CF6" stroke-width="1" fill="none" opacity="0.3">
    <!-- From IDEIA -->
    <path d="M80 350 Q80 280 140 220"/>
    <path d="M80 400 L80 320"/>
    <path d="M80 400 Q80 480 140 550"/>
    
    <!-- From DESIGN -->
    <path d="M350 280 Q350 180 420 140"/>
    <path d="M350 320 Q350 420 420 480"/>
    
    <!-- From CÓDIGO -->
    <path d="M600 190 Q600 120 670 80"/>
    <path d="M600 290 Q600 380 670 430"/>
    
    <!-- From ESTRATÉGIA -->
    <path d="M850 280 Q850 180 920 140"/>
    <path d="M850 320 Q850 420 920 480"/>
    
    <!-- To RESULTADO -->
    <path d="M1120 350 Q1120 280 1060 220"/>
    <path d="M1120 400 L1120 320"/>
    <path d="M1120 400 Q1120 480 1060 550"/>
  </g>
  
  <!-- Milestone 1: IDEIA -->
  <g transform="translate(80, 400)">
    <circle cx="0" cy="0" r="45" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="38" fill="#08080F"/>
    <!-- Lightbulb -->
    <ellipse cx="0" cy="-5" rx="12" ry="14" fill="none" stroke="#D946EF" stroke-width="2"/>
    <path d="M-6 10 L6 10" stroke="#D946EF" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4 14 L4 14" stroke="#D946EF" stroke-width="1.5" stroke-linecap="round"/>
    <text x="0" y="70" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">IDEIA</text>
  </g>
  
  <!-- Sub: Briefing -->
  <g transform="translate(140, 220)">
    <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Briefing</text>
  </g>
  
  <!-- Sub: Sonhos -->
  <g transform="translate(80, 320)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Sonhos</text>
  </g>
  
  <!-- Sub: Metas -->
  <g transform="translate(140, 550)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Metas</text>
  </g>
  
  <!-- Milestone 2: DESIGN -->
  <g transform="translate(350, 300)">
    <circle cx="0" cy="0" r="50" fill="#A855F7" fill-opacity="0.1" stroke="#A855F7" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="42" fill="#08080F"/>
    <!-- Palette -->
    <ellipse cx="0" cy="0" rx="20" ry="16" fill="none" stroke="#D946EF" stroke-width="2"/>
    <circle cx="-8" cy="-4" r="4" fill="#8B5CF6"/>
    <circle cx="4" cy="-8" r="3" fill="#D946EF"/>
    <circle cx="10" cy="0" r="3" fill="#A855F7"/>
    <circle cx="4" cy="8" r="3" fill="#E879F9"/>
    <text x="0" y="75" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">DESIGN</text>
  </g>
  
  <!-- Sub: UX/UI -->
  <g transform="translate(420, 140)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">UX/UI</text>
  </g>
  
  <!-- Sub: Wireframes -->
  <g transform="translate(420, 480)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Wireframes</text>
  </g>
  
  <!-- Milestone 3: CÓDIGO (Center) -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="60" fill="url(#purpleGrad2)"/>
    <circle cx="0" cy="0" r="52" fill="#08080F" stroke="#D946EF" stroke-width="2"/>
    <!-- Code brackets -->
    <text x="0" y="8" text-anchor="middle" fill="#D946EF" font-size="28" font-weight="300" 
      font-family="monospace">&lt;/&gt;</text>
    <text x="0" y="85" text-anchor="middle" fill="#E9D5FF" font-size="13" font-weight="600" 
      font-family="system-ui, sans-serif">CÓDIGO</text>
  </g>
  
  <!-- Sub: Front-end -->
  <g transform="translate(670, 80)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Front-end</text>
  </g>
  
  <!-- Sub: Back-end -->
  <g transform="translate(670, 430)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Back-end</text>
  </g>
  
  <!-- Milestone 4: ESTRATÉGIA -->
  <g transform="translate(850, 300)">
    <circle cx="0" cy="0" r="50" fill="#C084FC" fill-opacity="0.1" stroke="#C084FC" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="42" fill="#08080F"/>
    <!-- Target -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#D946EF" stroke-width="2"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#A855F7" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#D946EF"/>
    <text x="0" y="75" text-anchor="middle" fill="#D8B4FE" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">ESTRATÉGIA</text>
  </g>
  
  <!-- Sub: Marketing -->
  <g transform="translate(920, 140)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Marketing</text>
  </g>
  
  <!-- Sub: Conversão -->
  <g transform="translate(920, 480)">
    <rect x="-50" y="-15" width="100" height="30" rx="15" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Conversão</text>
  </g>
  
  <!-- Milestone 5: RESULTADO -->
  <g transform="translate(1120, 400)">
    <circle cx="0" cy="0" r="55" fill="url(#purpleGrad2)"/>
    <circle cx="0" cy="0" r="47" fill="#08080F" stroke="#E879F9" stroke-width="2"/>
    <!-- Trophy -->
    <path d="M-12 20 L-12 -5 C-12 -12 12 -12 12 -5 L12 20Z" fill="#D946EF" fill-opacity="0.6"/>
    <rect x="-15" y="20" width="30" height="5" rx="1" fill="#D946EF" fill-opacity="0.4"/>
    <rect x="-10" y="25" width="20" height="6" rx="1" fill="#D946EF" fill-opacity="0.3"/>
    <!-- Star -->
    <polygon points="0,-8 2,-3 7,-3 3,0 5,5 0,2 -5,5 -3,0 -7,-3 -2,-3" fill="#FFD700"/>
    <text x="0" y="80" text-anchor="middle" fill="#E9D5FF" font-size="12" font-weight="600" 
      font-family="system-ui, sans-serif">RESULTADO</text>
  </g>
  
  <!-- Sub: Vendas -->
  <g transform="translate(1060, 220)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#22C55E" fill-opacity="0.1" 
      stroke="#22C55E" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#86EFAC" font-size="11" 
      font-family="system-ui, sans-serif">Vendas</text>
  </g>
  
  <!-- Sub: Métricas -->
  <g transform="translate(1120, 320)">
    <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Métricas</text>
  </g>
  
  <!-- Sub: Escala -->
  <g transform="translate(1060, 550)">
    <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">Escala</text>
  </g>
  
  <!-- Decorative particles -->
  <g fill="#8B5CF6" opacity="0.15">
    <circle cx="200" cy="150" r="1.5"/>
    <circle cx="500" cy="120" r="1"/>
    <circle cx="700" cy="120" r="1.5"/>
    <circle cx="1000" cy="150" r="1"/>
    <circle cx="200" cy="650" r="1"/>
    <circle cx="1000" cy="650" r="1.5"/>
  </g>
</svg>