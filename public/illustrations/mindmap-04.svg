<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softGlow4">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#08080F"/>
  
  <!-- Subtle gradient -->
  <circle cx="600" cy="400" r="350" fill="#22C55E" opacity="0.02"/>
  
  <!-- Grid pattern -->
  <g stroke="#22C55E" stroke-width="0.5" opacity="0.05">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>
  
  <!-- Radial connection lines -->
  <g stroke="#22C55E" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top -->
    <path d="M600 300 Q580 200 460 150"/>
    <path d="M600 300 Q600 180 600 120"/>
    <path d="M600 300 Q620 200 740 150"/>
    
    <!-- Left -->
    <path d="M490 400 Q360 380 260 320"/>
    <path d="M490 400 Q320 400 200 400"/>
    <path d="M490 400 Q360 420 260 480"/>
    
    <!-- Right -->
    <path d="M710 400 Q840 380 940 320"/>
    <path d="M710 400 Q880 400 1000 400"/>
    <path d="M710 400 Q840 420 940 480"/>
    
    <!-- Bottom -->
    <path d="M600 500 Q560 600 500 680"/>
    <path d="M600 500 L600 720"/>
    <path d="M600 500 Q640 600 700 680"/>
  </g>
  
  <!-- Small connector dots -->
  <g fill="#22C55E" opacity="0.5">
    <circle cx="530" cy="230" r="2"/>
    <circle cx="670" cy="230" r="2"/>
    <circle cx="375" cy="360" r="2"/>
    <circle cx="825" cy="360" r="2"/>
    <circle cx="550" cy="580" r="2"/>
    <circle cx="650" cy="580" r="2"/>
  </g>
  
  <!-- Central Hub -->
  <g filter="url(#softGlow4)">
    <circle cx="600" cy="400" r="80" fill="url(#greenGrad)"/>
    <circle cx="600" cy="400" r="72" fill="#08080F" stroke="#22C55E" stroke-width="2"/>
    
    <!-- Chart trending up -->
    <g transform="translate(560, 365)">
      <path d="M0 45 L0 25 L20 25 L20 5 L40 5 L40 35 L60 35 L60 15 L80 15 L80 0" 
        stroke="#22C55E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="80" cy="0" r="5" fill="#22C55E"/>
      <path d="M55 18 L80 0" stroke="#86EFAC" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Top Left: Analytics -->
  <g transform="translate(460, 150)">
    <rect x="-55" y="-20" width="110" height="40" rx="20" fill="#8B5CF6" fill-opacity="0.1" 
      stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Analytics</text>
  </g>
  
  <!-- Top Center: Dashboards -->
  <g transform="translate(600, 120)">
    <rect x="-60" y="-20" width="120" height="40" rx="20" fill="#22C55E" fill-opacity="0.12" 
      stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#86EFAC" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Dashboards</text>
  </g>
  
  <!-- Top Right: ROI -->
  <g transform="translate(740, 150)">
    <rect x="-45" y="-20" width="90" height="40" rx="20" fill="#A855F7" fill-opacity="0.1" 
      stroke="#A855F7" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#D8B4FE" font-size="13" font-weight="600" 
      font-family="system-ui, sans-serif">ROI +180%</text>
  </g>
  
  <!-- Left 1: Conversões -->
  <g transform="translate(260, 320)">
    <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Conversões</text>
  </g>
  
  <!-- Left 2: Métricas -->
  <g transform="translate(200, 400)">
    <rect x="-50" y="-16" width="100" height="32" rx="16" fill="#22C55E" fill-opacity="0.08" 
      stroke="#22C55E" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#86EFAC" font-size="11" 
      font-family="system-ui, sans-serif">Métricas</text>
  </g>
  
  <!-- Left 3: ROI Comprovado -->
  <g transform="translate(260, 480)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#10B981" fill-opacity="0.08" 
      stroke="#10B981" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#6EE7B7" font-size="11" 
      font-family="system-ui, sans-serif">ROI Comprovado</text>
  </g>
  
  <!-- Right 1: Cliques -->
  <g transform="translate(940, 320)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Cliques</text>
  </g>
  
  <!-- Right 2: Decisões Data -->
  <g transform="translate(1000, 400)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#22C55E" fill-opacity="0.08" 
      stroke="#22C55E" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#86EFAC" font-size="11" 
      font-family="system-ui, sans-serif">Decisões Data-Driven</text>
  </g>
  
  <!-- Right 3: Escala -->
  <g transform="translate(940, 480)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="#D946EF" fill-opacity="0.08" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#F0ABFC" font-size="11" 
      font-family="system-ui, sans-serif">Escala</text>
  </g>
  
  <!-- Bottom Left: Automação -->
  <g transform="translate(500, 680)">
    <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.08" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#A78BFA" font-size="11" 
      font-family="system-ui, sans-serif">Automação</text>
  </g>
  
  <!-- Bottom Center: Escala Juntos -->
  <g transform="translate(600, 720)">
    <rect x="-60" y="-16" width="120" height="32" rx="16" fill="#22C55E" fill-opacity="0.12" 
      stroke="#22C55E" stroke-width="1.5"/>
    <text x="0" y="4" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">Escala Juntos</text>
  </g>
  
  <!-- Bottom Right: R$ Investido -->
  <g transform="translate(700, 680)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#A855F7" fill-opacity="0.08" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#C4B5FD" font-size="11" 
      font-family="system-ui, sans-serif">R$ Investido</text>
  </g>
  
  <!-- Mini chart decoration -->
  <g transform="translate(100, 180)" opacity="0.4">
    <rect x="0" y="40" width="18" height="30" rx="3" fill="#22C55E" opacity="0.3"/>
    <rect x="25" y="28" width="18" height="42" rx="3" fill="#22C55E" opacity="0.5"/>
    <rect x="50" y="15" width="18" height="55" rx="3" fill="#22C55E" opacity="0.7"/>
    <rect x="75" y="0" width="18" height="70" rx="3" fill="#22C55E"/>
    <path d="M9 35 L34 22 L59 8 L84 -5" stroke="#86EFAC" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Decorative particles -->
  <g fill="#22C55E" opacity="0.2">
    <circle cx="100" cy="400" r="4"/>
    <circle cx="1100" cy="250" r="3"/>
    <circle cx="150" cy="650" r="3"/>
    <circle cx="1050" cy="650" r="4"/>
    <circle cx="400" cy="100" r="1.5"/>
    <circle cx="800" cy="100" r="1.5"/>
  </g>
</svg>