<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speed1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5B2EFF"/>
      <stop offset="100%" style="stop-color:#D946EF"/>
    </linearGradient>
    <linearGradient id="speed2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF6B00"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="motion">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background with speed lines -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Speed lines background -->
  <g stroke="url(#speed1)" stroke-width="2" opacity="0.15">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>
  
  <!-- Central Rocket -->
  <g transform="translate(400, 250)" filter="url(#glow3)">
    <!-- Rocket body -->
    <path d="M0 -150 C-40 -100 -50 -50 -50 50 L50 50 C50 -50 40 -100 0 -150Z" fill="url(#speed1)"/>
    <path d="M0 -140 C-30 -95 -40 -50 -40 40 L40 40 C40 -50 30 -95 0 -140Z" fill="white" opacity="0.3"/>
    
    <!-- Rocket window -->
    <ellipse cx="0" cy="-60" rx="20" ry="25" fill="#0a0a1a"/>
    <ellipse cx="0" cy="-60" rx="15" ry="18" fill="#1a1a2e"/>
    <ellipse cx="-5" cy="-65" rx="5" ry="8" fill="white" opacity="0.4"/>
    
    <!-- Rocket details -->
    <rect x="-45" y="10" width="90" height="25" rx="3" fill="#D946EF"/>
    <rect x="-45" y="10" width="90" height="12" rx="3" fill="#A855F7"/>
    
    <!-- Fins -->
    <path d="M-50 40 L-80 80 L-50 70 Z" fill="#8B5CF6"/>
    <path d="M50 40 L80 80 L50 70 Z" fill="#8B5CF6"/>
    
    <!-- Flames -->
    <g filter="url(#glow3)">
      <ellipse cx="0" cy="70" rx="30" ry="50" fill="#FF6B00" opacity="0.8"/>
      <ellipse cx="0" cy="65" rx="20" ry="40" fill="#FFD700" opacity="0.9"/>
      <ellipse cx="0" cy="60" rx="10" ry="25" fill="white" opacity="0.8"/>
      
      <!-- Flame particles -->
      <circle cx="-15" cy="100" r="5" fill="#FF6B00" opacity="0.7"/>
      <circle cx="20" cy="90" r="4" fill="#FFD700" opacity="0.6"/>
      <circle cx="-10" cy="115" r="3" fill="#FF6B00" opacity="0.5"/>
      <circle cx="15" cy="110" r="6" fill="#FFD700" opacity="0.4"/>
    </g>
  </g>
  
  <!-- Motion trails -->
  <g opacity="0.3">
    <path d="M200 200 Q300 220 400 250" stroke="url(#speed1)" stroke-width="3" fill="none" stroke-dasharray="10,10"/>
    <path d="M600 200 Q500 220 400 250" stroke="url(#speed1)" stroke-width="3" fill="none" stroke-dasharray="10,10"/>
    <path d="M180 350 Q280 320 400 250" stroke="url(#speed1)" stroke-width="2" fill="none" stroke-dasharray="8,8"/>
    <path d="M620 350 Q520 320 400 250" stroke="url(#speed1)" stroke-width="2" fill="none" stroke-dasharray="8,8"/>
  </g>
  
  <!-- Speed indicators - clock/time -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="50" fill="white" stroke="url(#speed1)" stroke-width="4" filter="url(#glow3)"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f3f4f6" stroke-width="2"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#5B2EFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="10" stroke="#D946EF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#5B2EFF"/>
    <!-- Speed arrow -->
    <path d="M25 -20 L35 -25 L35 -15 L25 -20" fill="#FF6B00"/>
  </g>
  
  <!-- MVP badge -->
  <g transform="translate(650, 100)">
    <rect x="-60" y="-30" width="120" height="60" rx="12" fill="url(#speed1)" filter="url(#glow3)"/>
    <text x="0" y="8" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Arial">MVP</text>
    <!-- Sparkle -->
    <circle cx="50" cy="-20" r="8" fill="#FFD700" filter="url(#glow3)"/>
  </g>
  
  <!-- Iteration arrows -->
  <g transform="translate(650, 300)">
    <circle cx="0" cy="0" r="45" fill="white" stroke="#5B2EFF" stroke-width="3"/>
    <path d="M-20 -15 A25 25 0 1 1 -15 20" stroke="#5B2EFF" stroke-width="4" fill="none" stroke-linecap="round"/>
    <polygon points="-15,20 -20,10 -8,12" fill="#5B2EFF"/>
    <text x="0" y="5" text-anchor="middle" fill="#5B2EFF" font-size="12" font-weight="bold">LOOP</text>
  </g>
  
  <!-- Fast delivery package -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="#5B2EFF" filter="url(#glow3)"/>
    <rect x="30" y="0" width="20" height="60" fill="#8B5CF6"/>
    <rect x="0" y="25" width="80" height="10" fill="#D946EF"/>
    <path d="M0 0 L40 30 L80 0" stroke="white" stroke-width="2" fill="none"/>
    <!-- Speed lines -->
    <line x1="90" y1="20" x2="120" y2="20" stroke="#FF6B00" stroke-width="3" stroke-linecap="round"/>
    <line x1="95" y1="30" x2="130" y2="30" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    <line x1="90" y1="40" x2="110" y2="40" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Feedback stars -->
  <g transform="translate(680, 420)" filter="url(#glow3)">
    <polygon points="0,-30 7,-10 28,-10 12,3 18,24 0,12 -18,24 -12,3 -28,-10 -7,-10" fill="#FFD700"/>
    <polygon points="0,-20 5,-7 19,-7 8,2 12,16 0,8 -12,16 -8,2 -19,-7 -5,-7" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Lightning bolts for speed -->
  <g fill="#FFD700" filter="url(#glow3)">
    <polygon points="180,300 200,300 190,330 210,330 170,380 185,340 165,340" opacity="0.8"/>
    <polygon points="600,150 615,150 607,175 625,175 590,215 603,182 588,182" transform="scale(0.8)" opacity="0.6"/>
  </g>
  
  <!-- Checkmarks -->
  <g transform="translate(300, 420)">
    <circle cx="0" cy="0" r="20" fill="#22C55E"/>
    <path d="M-8 0 L-3 5 L8 -8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <g transform="translate(400, 450)">
    <circle cx="0" cy="0" r="20" fill="#22C55E"/>
    <path d="M-8 0 L-3 5 L8 -8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <g transform="translate(500, 420)">
    <circle cx="0" cy="0" r="20" fill="#22C55E"/>
    <path d="M-8 0 L-3 5 L8 -8" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>