<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <linearGradient id="botBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="600" fill="url(#bg)"/>
  
  <!-- Header -->
  <rect width="300" height="70" fill="#FF6B00"/>
  <circle cx="35" cy="35" r="20" fill="#fff" opacity="0.2"/>
  <text x="35" y="40" fill="#fff" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">IA</text>
  <text x="65" y="30" fill="#fff" font-family="Arial" font-size="14" font-weight="bold">Inteligência Itaú</text>
  <text x="65" y="48" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">Online • Pronto para ajudar</text>
  
  <!-- Chat Messages -->
  
  <!-- Bot Message 1 -->
  <rect x="15" y="90" width="200" height="45" rx="15" fill="url(#botBubble)"/>
  <text x="25" y="110" fill="#fff" font-family="Arial" font-size="11">Olá! Sou a Inteligência</text>
  <text x="25" y="125" fill="#fff" font-family="Arial" font-size="11">Itaú. Como posso ajudar?</text>
  <circle cx="20" cy="112" r="5" fill="#FF6B00"/>
  
  <!-- User Message 1 -->
  <rect x="85" y="150" width="200" height="40" rx="15" fill="url(#userBubble)"/>
  <text x="295" y="175" fill="#fff" font-family="Arial" font-size="11" text-anchor="end">Quero fazer um Pix</text>
  
  <!-- Bot Message 2 -->
  <rect x="15" y="205" width="220" height="60" rx="15" fill="url(#botBubble)"/>
  <text x="25" y="225" fill="#fff" font-family="Arial" font-size="11">Claro! Para quem você quer</text>
  <text x="25" y="240" fill="#fff" font-family="Arial" font-size="11">enviar? Pode me dizer o</text>
  <text x="25" y="255" fill="#fff" font-family="Arial" font-size="11">nome ou chave Pix.</text>
  <circle cx="20" cy="232" r="5" fill="#FF6B00"/>
  
  <!-- User Message 2 -->
  <rect x="85" y="280" width="180" height="40" rx="15" fill="url(#userBubble)"/>
  <text x="275" y="305" fill="#fff" font-family="Arial" font-size="11" text-anchor="end">Para Maria, chave CPF</text>
  
  <!-- Bot Message 3 -->
  <rect x="15" y="335" width="230" height="70" rx="15" fill="url(#botBubble)"/>
  <text x="25" y="355" fill="#fff" font-family="Arial" font-size="11">Encontrei Maria Silva.</text>
  <text x="25" y="370" fill="#fff" font-family="Arial" font-size="11">Confirme: R$ 50,00 para</text>
  <text x="25" y="385" fill="#fff" font-family="Arial" font-size="11">Maria Silva.</text>
  <text x="25" y="400" fill="#FF6B00" font-family="Arial" font-size="11">Posso processar?</text>
  <circle cx="20" cy="370" r="5" fill="#FF6B00"/>
  
  <!-- User Message 3 -->
  <rect x="115" y="420" width="80" height="35" rx="15" fill="url(#userBubble)"/>
  <text x="155" y="442" fill="#fff" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Sim!</text>
  
  <!-- Bot Message 4 - Success -->
  <rect x="15" y="470" width="250" height="55" rx="15" fill="#0d3320"/>
  <text x="25" y="490" fill="#22c55e" font-family="Arial" font-size="12" font-weight="bold">✓ Pix realizado com sucesso!</text>
  <text x="25" y="508" fill="#fff" font-family="Arial" font-size="10">R$ 50,00 enviado para Maria Silva.</text>
  <text x="25" y="520" fill="#888" font-family="Arial" font-size="9">Comprovante enviado por e-mail.</text>
  <circle cx="20" cy="497" r="5" fill="#22c55e"/>
  
  <!-- Input Area -->
  <rect x="0" y="540" width="300" height="60" fill="#0f0f1a"/>
  <rect x="15" y="555" width="220" height="35" rx="20" fill="#2a2a3e"/>
  <text x="30" y="578" fill="#666" font-family="Arial" font-size="12">Digite sua mensagem...</text>
  <circle cx="265" cy="572" r="18" fill="url(#primary)"/>
  <polygon points="260,572 275,565 275,579" fill="#fff"/>
  
  <!-- Status Bar -->
  <rect x="0" y="0" width="300" height="25" fill="#0a0a0f"/>
  <text x="150" y="17" fill="#fff" font-family="Arial" font-size="10" text-anchor="middle">10:30</text>
  <rect x="250" y="8" width="20" height="10" rx="2" fill="none" stroke="#fff" stroke-width="1"/>
  <rect x="252" y="10" width="6" height="6" rx="1" fill="#fff"/>
  <rect x="253" y="6" width="10" height="2" rx="1" fill="#fff"/>
  <rect x="268" y="8" width="4" height="6" fill="none" stroke="#fff" stroke-width="1"/>
</svg>