  <title>MedPlus Hospitalar</title>
  <script>
    var path = window.location.pathname || '/';
    if (path.startsWith('/medpluscomerciohospitalar')) {
      var newPath = '/medpluscomerciohospitalar/index.html';
      if (path !== '/medpluscomerciohospitalar/' && path !== '/medpluscomerciohospitalar') {
        var params = path.replace('/medpluscomerciohospitalar', '').replace(/^\//, '');
        newPath = '/medpluscomerciohospitalar/?' + params;
      }
      window.location.replace(newPath);
    }
  </script>
