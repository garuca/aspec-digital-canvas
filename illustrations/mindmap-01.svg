<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#08080F"/>
  
  <!-- Subtle radial gradient -->
  <circle cx="600" cy="400" r="400" fill="url(#purpleGrad)" opacity="0.03"/>
  
  <!-- Connection lines - elegant curves -->
  <g stroke="url(#lineGrad)" stroke-width="1.5" fill="none" opacity="0.6">
    <!-- Top branches -->
    <path d="M600 280 Q580 200 450 150"/>
    <path d="M600 280 Q600 180 600 120"/>
    <path d="M600 280 Q620 200 750 150"/>
    
    <!-- Left branches -->
    <path d="M480 400 Q350 380 250 320"/>
    <path d="M480 400 Q300 400 180 400"/>
    <path d="M480 400 Q350 420 250 480"/>
    
    <!-- Right branches -->
    <path d="M720 400 Q850 380 950 320"/>
    <path d="M720 400 Q900 400 1020 400"/>
    <path d="M720 400 Q850 420 950 480"/>
    
    <!-- Bottom branches -->
    <path d="M600 520 Q550 620 480 680"/>
    <path d="M600 520 Q600 650 600 720"/>
    <path d="M600 520 Q650 620 720 680"/>
  </g>
  
  <!-- Small connector dots -->
  <g fill="#8B5CF6" opacity="0.4">
    <circle cx="520" cy="220" r="2"/>
    <circle cx="680" cy="220" r="2"/>
    <circle cx="360" cy="360" r="2"/>
    <circle cx="840" cy="360" r="2"/>
    <circle cx="540" cy="600" r="2"/>
    <circle cx="660" cy="600" r="2"/>
  </g>
  
  <!-- Central Hub -->
  <g filter="url(#softGlow)">
    <circle cx="600" cy="400" r="70" fill="url(#purpleGrad)"/>
    <circle cx="600" cy="400" r="65" fill="#08080F" stroke="url(#pinkGrad)" stroke-width="2"/>
    
    <!-- Magnifying glass icon -->
    <g transform="translate(565, 365)">
      <circle cx="35" cy="35" r="28" stroke="#D946EF" stroke-width="3" fill="none"/>
      <line x1="55" y1="55" x2="72" y2="72" stroke="#D946EF" stroke-width="4" stroke-linecap="round"/>
      <!-- Brain simplified -->
      <path d="M25 25 Q20 15 30 10 Q40 5 50 10 Q60 15 55 25 Q50 35 40 38 Q30 35 25 25" 
        fill="#D946EF" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Top Left: Análise de Processos -->
  <g transform="translate(450, 150)">
    <rect x="-65" y="-22" width="130" height="44" rx="22" fill="#8B5CF6" fill-opacity="0.15" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Análise de Processos</text>
  </g>
  
  <!-- Top Center: Mapeamento -->
  <g transform="translate(600, 120)">
    <rect x="-70" y="-22" width="140" height="44" rx="22" fill="#A855F7" fill-opacity="0.15" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#D8B4FE" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Mapeamento de Gargalos</text>
  </g>
  
  <!-- Top Right: Impacto -->
  <g transform="translate(750, 150)">
    <rect x="-55" y="-22" width="110" height="44" rx="22" fill="#7C3AED" fill-opacity="0.15" 
      stroke="#7C3AED" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="13" font-weight="500" 
      font-family="system-ui, sans-serif">Impacto Tecnológico</text>
  </g>
  
  <!-- Left 1: Fluxogramas -->
  <g transform="translate(250, 320)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.1" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Fluxogramas</text>
  </g>
  
  <!-- Left 2: Entrevistas -->
  <g transform="translate(180, 400)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#A855F7" fill-opacity="0.1" 
      stroke="#A855F7" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Entrevistas</text>
  </g>
  
  <!-- Left 3: Análise de Dados -->
  <g transform="translate(250, 480)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#D946EF" fill-opacity="0.1" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#F0ABFC" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Análise de Dados</text>
  </g>
  
  <!-- Right 1: ROI +40% -->
  <g transform="translate(950, 320)">
    <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#22C55E" fill-opacity="0.1" 
      stroke="#22C55E" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#86EFAC" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">+40% ROI</text>
  </g>
  
  <!-- Right 2: Automação -->
  <g transform="translate(1020, 400)">
    <rect x="-55" y="-18" width="110" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.1" 
      stroke="#8B5CF6" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#A78BFA" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Automação</text>
  </g>
  
  <!-- Right 3: Novos Mercados -->
  <g transform="translate(950, 480)">
    <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#D946EF" fill-opacity="0.1" 
      stroke="#D946EF" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#F0ABFC" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Novos Mercados</text>
  </g>
  
  <!-- Bottom Left: Plano de Ação -->
  <g transform="translate(480, 680)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#6366F1" fill-opacity="0.1" 
      stroke="#6366F1" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#A5B4FC" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Plano de Ação</text>
  </g>
  
  <!-- Bottom Center: Métricas -->
  <g transform="translate(600, 720)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#8B5CF6" fill-opacity="0.15" 
      stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#C4B5FD" font-size="12" font-weight="500" 
      font-family="system-ui, sans-serif">Definição de Métricas</text>
  </g>
  
  <!-- Bottom Right: Solução -->
  <g transform="translate(720, 680)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#7C3AED" fill-opacity="0.1" 
      stroke="#7C3AED" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" fill="#DDD6FE" font-size="12" font-weight="400" 
      font-family="system-ui, sans-serif">Solução Sob Medida</text>
  </g>
  
  <!-- Decorative subtle particles -->
  <g fill="#8B5CF6" opacity="0.2">
    <circle cx="100" cy="100" r="1.5"/>
    <circle cx="1100" cy="150" r="1"/>
    <circle cx="150" cy="700" r="1.5"/>
    <circle cx="1050" cy="650" r="1"/>
    <circle cx="350" cy="200" r="1"/>
    <circle cx="850" cy="200" r="1.5"/>
  </g>
</svg>