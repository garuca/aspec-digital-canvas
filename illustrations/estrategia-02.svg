<svg viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="road1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#5B2EFF"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#D946EF"/>
    </linearGradient>
    <linearGradient id="road2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D946EF"/>
      <stop offset="100%" style="stop-color:#5B2EFF"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fire">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Gradient orbs -->
  <circle cx="100" cy="450" r="200" fill="#5B2EFF" opacity="0.08"/>
  <circle cx="700" cy="50" r="150" fill="#D946EF" opacity="0.08"/>
  
  <!-- Road/Path -->
  <g transform="translate(250, 0)">
    <!-- Main road -->
    <path d="M150 500 Q150 350 150 250 Q150 150 200 100 Q250 50 400 50 Q550 50 600 150 Q650 250 650 500" 
      stroke="url(#road1)" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M150 500 Q150 350 150 250 Q150 150 200 100 Q250 50 400 50 Q550 50 600 150 Q650 250 650 500" 
      stroke="#f3f4f6" stroke-width="20" fill="none" stroke-linecap="round" stroke-dasharray="30,20"/>
    
    <!-- Milestones -->
    <g filter="url(#glow2)">
      <!-- Start flag -->
      <rect x="130" y="420" width="8" height="60" fill="#5B2EFF"/>
      <rect x="138" y="420" width="25" height="18" fill="#22C55E"/>
      <rect x="138" y="432" width="25" height="18" fill="white"/>
      
      <!-- Checkpoints -->
      <circle cx="150" cy="300" r="12" fill="#8B5CF6" stroke="white" stroke-width="3"/>
      <circle cx="180" cy="200" r="15" fill="#A855F7" stroke="white" stroke-width="3"/>
      <circle cx="400" cy="50" r="18" fill="#D946EF" stroke="white" stroke-width="3" filter="url(#glow2)"/>
      
      <!-- Finish rocket -->
      <g transform="translate(620, 80)">
        <path d="M30 60 L30 20 L45 35 L60 20 L60 60 Z" fill="#5B2EFF"/>
        <path d="M35 60 L35 25 L45 35 L55 25 L55 60 Z" fill="#8B5CF6"/>
        <circle cx="45" cy="40" r="8" fill="#FFD700"/>
        <!-- Fire/launch effect -->
        <path d="M35 65 Q45 85 55 65" stroke="#FF6B00" stroke-width="4" fill="none" filter="url(#fire)"/>
        <path d="M38 68 Q45 82 52 68" stroke="#FFD700" stroke-width="2" fill="none"/>
      </g>
    </g>
  </g>
  
  <!-- Building blocks -->
  <g transform="translate(50, 300)">
    <rect x="0" y="80" width="60" height="60" rx="8" fill="#5B2EFF" opacity="0.9" filter="url(#glow2)"/>
    <rect x="10" y="90" width="40" height="40" rx="4" fill="white" opacity="0.3"/>
    
    <rect x="70" y="50" width="55" height="90" rx="8" fill="#8B5CF6" opacity="0.9" filter="url(#glow2)"/>
    <rect x="80" y="60" width="35" height="30" rx="4" fill="white" opacity="0.3"/>
    <rect x="80" y="100" width="35" height="30" rx="4" fill="white" opacity="0.3"/>
    
    <rect x="135" y="20" width="50" height="120" rx="8" fill="#A855F7" opacity="0.9" filter="url(#glow2)"/>
    <rect x="143" y="30" width="34" height="25" rx="4" fill="white" opacity="0.3"/>
    <rect x="143" y="65" width="34" height="25" rx="4" fill="white" opacity="0.3"/>
    <rect x="143" y="100" width="34" height="30" rx="4" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Gear/cogwheel -->
  <g transform="translate(620, 320)" filter="url(#glow2)">
    <circle cx="50" cy="50" r="50" fill="#D946EF" opacity="0.2"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#D946EF" stroke-width="8"/>
    <circle cx="50" cy="50" r="15" fill="#D946EF"/>
    <!-- Gear teeth -->
    <rect x="42" y="0" width="16" height="15" rx="3" fill="#D946EF"/>
    <rect x="42" y="85" width="16" height="15" rx="3" fill="#D946EF"/>
    <rect x="0" y="42" width="15" height="16" rx="3" fill="#D946EF"/>
    <rect x="85" y="42" width="15" height="16" rx="3" fill="#D946EF"/>
  </g>
  
  <!-- Sparkles -->
  <g fill="#FFD700" filter="url(#glow2)">
    <path d="M180 150 L183 160 L193 160 L185 167 L188 177 L180 171 L172 177 L175 167 L167 160 L177 160 Z"/>
    <path d="M550 250 L552 257 L560 257 L554 262 L556 270 L550 265 L544 270 L546 262 L540 257 L548 257 Z" transform="scale(0.8)"/>
    <path d="M720 180 L722 187 L730 187 L724 192 L726 200 L720 195 L714 200 L716 192 L710 187 L718 187 Z" transform="scale(0.7)"/>
  </g>
  
  <!-- Connection dots -->
  <g filter="url(#glow2)">
    <circle cx="300" cy="180" r="5" fill="#5B2EFF"/>
    <circle cx="350" cy="220" r="4" fill="#8B5CF6"/>
    <circle cx="400" cy="180" r="6" fill="#A855F7"/>
    <circle cx="450" cy="150" r="5" fill="#D946EF"/>
    <line x1="300" y1="180" x2="350" y2="220" stroke="#5B2EFF" stroke-width="2" opacity="0.5"/>
    <line x1="350" y1="220" x2="400" y2="180" stroke="#8B5CF6" stroke-width="2" opacity="0.5"/>
    <line x1="400" y1="180" x2="450" y2="150" stroke="#A855F7" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Trophy/Success -->
  <g transform="translate(680, 380)" filter="url(#glow2)">
    <path d="M25 0 L25 40 L10 40 L10 55 L40 55 L40 40 L25 40 L25 0" fill="url(#road2)"/>
    <rect x="15" y="55" width="20" height="10" fill="#D946EF"/>
    <rect x="10" y="65" width="30" height="8" rx="2" fill="#5B2EFF"/>
    <ellipse cx="25" cy="20" rx="15" ry="18" fill="none" stroke="#FFD700" stroke-width="3"/>
    <path d="M10 15 Q0 15 0 25 Q0 35 10 35" stroke="#FFD700" stroke-width="3" fill="none"/>
    <path d="M40 15 Q50 15 50 25 Q50 35 40 35" stroke="#FFD700" stroke-width="3" fill="none"/>
    <!-- Star on trophy -->
    <polygon points="25,8 27,14 33,14 28,18 30,24 25,20 20,24 22,18 17,14 23,14" fill="#FFD700"/>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.6">
    <rect x="500" y="400" width="40" height="40" rx="8" fill="#5B2EFF" opacity="0.3" transform="rotate(15, 520, 420)"/>
    <rect x="150" y="200" width="30" height="30" rx="6" fill="#D946EF" opacity="0.3" transform="rotate(-20, 165, 215)"/>
  </g>
</svg>