<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASPEC | Redirecionando...</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Fallback meta refresh redirecting to the official ASPEC WhatsApp channel -->
  <meta http-equiv="refresh" content="0; url=https://api.whatsapp.com/send/?phone=5562982412665&text&type=phone_number&app_absent=0">
  <script>
    (function() {
      const defaultPhone = '5562982412665';
      const params = new URLSearchParams(window.location.search);
      
      // Extract phone number or use default
      const phone = params.get('phone') || params.get('number') || params.get('tel') || defaultPhone;
      
      // Extract text message if present
      const text = params.get('text') || params.get('txt') || '';
      
      // Construct target WhatsApp API URL
      let targetUrl = 'https://api.whatsapp.com/send/?phone=' + phone + '&type=phone_number&app_absent=0';
      if (text) {
        targetUrl += '&text=' + encodeURIComponent(text);
      } else {
        targetUrl += '&text=';
      }
      
      // Perform immediate redirect
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body>
  <p>Redirecionando para o WhatsApp... Se não for redirecionado automaticamente, <a href="https://api.whatsapp.com/send/?phone=5562982412665&text&type=phone_number&app_absent=0">clique aqui</a>.</p>
</body>
</html>
