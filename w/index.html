<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASPEC | Redirecionando para o WhatsApp</title>
    <meta name="description" content="Redirecionando para o canal de atendimento oficial da ASPEC no WhatsApp." />
    <meta name="robots" content="noindex, nofollow" />
    
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts: Inter and Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --primary: #FF6B2C;
        --primary-hover: #E55A1B;
        --bg-dark: #020617;
        --border-dark: #1E293B;
        --whatsapp: #25D366;
        --text-main: #FFFFFF;
        --text-muted: #94A3B8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: 0 !important; /* Strict brutalist cantos retos */
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Inter', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 1.5rem;
      }

      .container {
        max-width: 500px;
        width: 100%;
        border: 2px solid var(--text-main);
        background-color: #0f172a; /* Card dark background */
        padding: 2rem;
        box-shadow: 8px 8px 0px 0px var(--primary);
        position: relative;
      }

      /* Brutalist label on border */
      .container::before {
        content: "ASPEC_GATEWAY_V1.0";
        position: absolute;
        top: -12px;
        left: 20px;
        background-color: var(--primary);
        color: var(--bg-dark);
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 8px;
        border: 1px solid var(--text-main);
      }

      .logo-section {
        display: flex;
        justify-content: center;
        margin-bottom: 1.5rem;
      }
      
      .logo-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .title-mono {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.025em;
        font-size: 1.25rem;
        line-height: 1.2;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-dark);
        padding-bottom: 1rem;
        text-align: center;
      }

      .terminal-box {
        background-color: #020617;
        border: 1px solid var(--border-dark);
        padding: 1.25rem;
        font-family: 'Space Mono', monospace;
        font-size: 0.8rem;
        color: var(--whatsapp);
        margin-bottom: 1.5rem;
        min-height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 0.5rem;
      }

      .terminal-line {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        line-height: 1.3;
      }

      .terminal-line::before {
        content: ">";
        color: var(--primary);
        font-weight: bold;
        flex-shrink: 0;
      }

      .progress-bar-container {
        width: 100%;
        height: 6px;
        background-color: #020617;
        border: 1px solid var(--border-dark);
        margin-bottom: 1.5rem;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background-color: var(--primary);
        width: 0%;
        transition: width 0.1s linear;
      }

      .btn-brutalist {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        background-color: var(--primary);
        color: #FFFFFF;
        border: 2px solid var(--text-main);
        padding: 0.875rem 1.5rem;
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 4px 4px 0px 0px var(--whatsapp);
        cursor: pointer;
        gap: 0.5rem;
      }

      .btn-brutalist:hover {
        background-color: var(--primary-hover);
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px 0px var(--whatsapp);
      }

      .btn-brutalist:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px var(--whatsapp);
      }

      .footer-text {
        font-family: 'Space Mono', monospace;
        font-size: 9px;
        color: var(--text-muted);
        text-align: center;
        margin-top: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .pulse {
        animation: pulse-anim 1.5s infinite;
      }

      @keyframes pulse-anim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-section">
        <div class="logo-container">
          <!-- Absolute path used so it resolves correctly on www.aspec.ia.br/w -->
          <img src="/logo.svg" alt="ASPEC" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';" class="h-10" style="height: 40px; width: auto;">
          <span id="logo-fallback" style="display:none;" class="font-mono font-bold text-xl tracking-widest" style="color: var(--primary); font-family: 'Space Mono', monospace;">ASPEC</span>
        </div>
      </div>

      <h1 class="title-mono pulse">Conectando ao WhatsApp...</h1>

      <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
      </div>

      <div id="terminal" class="terminal-box">
        <!-- Log lines populated by JS -->
      </div>

      <a id="redirect-btn" href="#" class="btn-brutalist">
        Abrir Chat Manualmente
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-right"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </a>

      <div class="footer-text">
        © 2026 ASPEC • Inteligência Artificial & Software
      </div>
    </div>

    <script>
      (function() {
        const defaultPhone = '5562982412665';
        const params = new URLSearchParams(window.location.search);
        
        // Extract phone number or use default
        const phone = params.get('phone') || params.get('number') || params.get('tel') || defaultPhone;
        
        // Extract text message if present
        const text = params.get('text') || params.get('txt') || '';
        
        // Construct target WhatsApp URL
        let targetUrl = 'https://wa.me/' + phone;
        if (text) {
          targetUrl += '?text=' + encodeURIComponent(text);
        }
        
        // Set button link
        document.getElementById('redirect-btn').href = targetUrl;
        
        // Terminal logs animation simulation
        const logs = [
          'Estabelecendo conexão segura...',
          'Verificando protocolo de destino...',
          'Identificando canal de atendimento: ' + phone,
          'Redirecionando para wa.me...'
        ];
        
        const terminal = document.getElementById('terminal');
        const progress = document.getElementById('progress');
        
        let currentStep = 0;
        
        function appendLog() {
          if (currentStep < logs.length) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.textContent = logs[currentStep];
            terminal.appendChild(line);
            
            currentStep++;
            const pct = (currentStep / logs.length) * 100;
            progress.style.width = pct + '%';
            
            setTimeout(appendLog, 250);
          } else {
            // Final redirection trigger
            window.location.href = targetUrl;
          }
        }
        
        // Start terminal sequence
        setTimeout(appendLog, 100);

        // Immediate redirection attempt (non-blocking for standard browsers)
        // If the custom protocol handler trigger works instantly, they won't even see the logs finish
        try {
          window.location.replace(targetUrl);
        } catch(e) {
          console.warn("Direct redirection blocked or delayed. Waiting for animation sequence.", e);
        }

        // Set meta refresh fallback as a third safety layer
        const meta = document.createElement('meta');
        meta.httpEquiv = 'refresh';
        meta.content = '2; url=' + targetUrl;
        document.getElementsByTagName('head')[0].appendChild(meta);
      })();
    </script>
  </body>
</html>
