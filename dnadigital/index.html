<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASPEC IA | Plataforma de Marketing com Inteligência Artificial</title>
    <meta name="description" content="Automatize a criação de conteúdo para redes sociais com IA. Extraia o DNA da sua marca e gere posts profissionais para Instagram em segundos." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="ASPEC IA | Marketing com Inteligência Artificial" />
    <meta property="og:description" content="Plataforma SaaS para automação de conteúdo com IA. Gere legendas e imagens profissionais para Instagram." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF6B2C'/><text x='50%' y='65%' font-family='monospace' font-weight='bold' font-size='55' fill='white' text-anchor='middle'>A</text></svg>" />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts: Inter (sans-serif) and Space Mono (monospace) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;750&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/dna.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/gerador.css" />

    <!-- Supabase CDN (optional, for when configured) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Schema JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ASPEC IA",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Plataforma de automação inteligente para marketing digital com IA",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>
  </head>
  <body>
    <!-- Main App Container -->
    <div id="app">
      <!-- Initial Loading State -->
      <div class="loading-overlay" id="initial-loader">
        <div class="loading-spinner"></div>
        <div class="loading-text">Carregando ASPEC IA...</div>
      </div>
    </div>

    <!-- App Script (ES Module) -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
