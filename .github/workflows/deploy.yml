name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://aspec.ia.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
      
      - name: Build
        run: bun run build
      
      - name: Build subprojects
        run: |
          # Build medplus-vision if exists
          if [ -d "../medplus-vision" ]; then
            cd ../medplus-vision
            bun install
            bun run build
            cd -
            cp -r ../medplus-vision/dist/* dist/medpluscomerciohospitalar/
          fi
          
          # Build decision-flow if exists
          if [ -d "../decision-flow" ]; then
            cd ../decision-flow
            bun install
            bun run build
            cd -
            cp -r ../decision-flow/dist/* dist/radar/
          fi

          # Build luizvieira (same GitHub Pages pattern as vivid)
          if [ -d "luizvieira-project" ]; then
            cd luizvieira-project
            bun install
            bun run build
            cd ..
            rm -rf dist/luizvieira
            mkdir -p dist/luizvieira
            cp -r luizvieira-project/dist/* dist/luizvieira/
          fi
        shell: bash
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
